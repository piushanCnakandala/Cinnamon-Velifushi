<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#252776">
<link rel="icon" type="image/png" href="img/logo-flower.png">
<link rel="apple-touch-icon" href="img/logo-flower.png">
<title>Cinnamon Velifushi – Guest Directory</title>
<meta name="description" content="Digital guest directory for Cinnamon Velifushi Maldives: menus, island experiences, spa, activities, resort map and more.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* BRAND COLOURS — Cinnamon purple & white. Change these to retheme the whole site. */
  --cream:#ffffff;          /* page background */
  --paper:#f6f6fb;          /* alternate section background (soft lilac-white) */
  --ink:#1c1c3c;            /* main text */
  --muted:#6b6b86;          /* secondary text */
  --line:#e3e3ef;           /* hairlines & borders */
  --cinnamon:#252776;       /* primary purple: accents, links, buttons */
  --cinnamon-d:#1a1b57;     /* darker purple */
  --gold:#b8b6e3;           /* soft lilac for fine details */
  --sea:#252776;            /* photo placeholder / dial centre */
  --night:#17183f;          /* dark contact strip */
  --tint:#dcdbf5;           /* light lilac text on photos */
  --shade:23,24,63;         /* RGB of photo overlays */
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:Jost,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --safeB:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);font-weight:400;background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
main{min-height:100vh;padding-bottom:calc(70px + var(--safeB))}
.eyebrow{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--cinnamon);font-weight:500}
.title{font-family:var(--serif);font-weight:500;line-height:1.08;color:var(--ink)}
.title .tilde{color:var(--gold);font-style:italic;margin-right:.08em}
.container{max-width:1080px;margin:0 auto;padding:0 20px}

/* ---------- top bar ---------- */
.topnav{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top,0px)) 18px 12px;transition:background .3s,box-shadow .3s,color .3s;color:#fff}
.topnav.solid{background:rgba(255,255,255,.96);backdrop-filter:blur(10px);box-shadow:0 1px 0 var(--line);color:var(--ink)}
.logo{display:flex;flex-direction:column;line-height:1}
.logo img{height:40px;width:auto;transition:filter .3s}
/* the logo file is white: tint it the logo's purple once the bar turns white on scroll */
.topnav.solid .logo img{filter:brightness(0) saturate(100%) invert(20%) sepia(38%) saturate(2960%) hue-rotate(247deg) brightness(92%) contrast(94%)}
.top-meta{display:flex;align-items:center;gap:12px}
.clock{font-size:12px;letter-spacing:.06em;opacity:.9;text-align:right}

/* ---------- top notifications ---------- */
.notif-wrap{position:relative}
.notif-btn{background:none;border:none;color:inherit;cursor:pointer;display:grid;place-items:center;position:relative;width:34px;height:34px;border-radius:50%;padding:0;transition:background .2s,transform .2s}
.notif-btn:hover{background:rgba(255,255,255,.18);transform:scale(1.06)}
.topnav.solid .notif-btn:hover{background:rgba(37,39,118,.08)}
.notif-svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.notif-dot{position:absolute;top:4px;right:4px;width:9px;height:9px;border-radius:50%;background:#ef4444;border:2px solid #fff;display:none}
.notif-dot.pulse{animation:notifPulse 2.4s infinite}
@keyframes notifPulse{0%{transform:scale(1);box-shadow:0 0 0 0 rgba(239,68,68,.7)}70%{transform:scale(1.2);box-shadow:0 0 0 8px rgba(239,68,68,0)}100%{transform:scale(1);box-shadow:0 0 0 0 rgba(239,68,68,0)}}

/* dropdown menu */
.notif-menu{position:absolute;top:calc(100% + 10px);right:0;width:340px;max-width:calc(100vw - 32px);background:#fff;color:var(--ink);border-radius:18px;box-shadow:0 14px 40px rgba(23,24,63,.18),0 0 0 1px var(--line);padding:14px;z-index:100;opacity:0;pointer-events:none;transform:translateY(8px) scale(.97);transition:opacity .25s ease,transform .25s ease}
.notif-wrap.open .notif-menu{opacity:1;pointer-events:auto;transform:translateY(0) scale(1)}
@media (hover: hover){
  .notif-wrap:hover .notif-menu{opacity:1;pointer-events:auto;transform:translateY(0) scale(1)}
}
.notif-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid var(--line)}
.notif-head h4{font-family:var(--serif);font-size:18px;font-weight:600;color:var(--ink);line-height:1}
.notif-head span{display:block;font-size:11px;color:var(--muted);letter-spacing:.04em;margin-top:2px}
.notif-mark-read{background:none;border:none;font-size:11px;color:var(--cinnamon);font-weight:500;cursor:pointer;padding:4px 8px;border-radius:8px}
.notif-mark-read:hover{background:var(--paper)}
.notif-list{display:flex;flex-direction:column;gap:8px;max-height:360px;overflow-y:auto;scrollbar-width:none}
.notif-list::-webkit-scrollbar{display:none}
.notif-item{display:flex;align-items:flex-start;gap:12px;padding:10px 12px;border-radius:12px;cursor:pointer;background:var(--paper);transition:background .2s,transform .15s;border:1px solid transparent;position:relative}
.notif-item:hover{background:#edeaf7;transform:translateX(2px)}
.notif-item.unread{background:#f3f1fb;border-color:rgba(37,39,118,.2)}
.notif-item-ic{width:36px;height:36px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;flex-shrink:0}
.notif-item-ic svg{width:18px;height:18px;stroke:var(--cinnamon);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.notif-item-tx{flex:1;min-width:0}
.notif-item-tag{display:inline-block;font-size:9.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:10px;margin-bottom:3px}
.notif-item-tx b{display:block;font-size:13.5px;font-weight:600;line-height:1.25;color:var(--ink);margin-bottom:2px}
.notif-item-tx p{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.notif-item-dot{position:absolute;top:10px;right:10px;width:7px;height:7px;border-radius:50%;background:#ef4444}
.notif-foot{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);text-align:center;font-size:11.5px;color:var(--cinnamon);font-weight:500}

/* detail modal */
.notif-modal-overlay{position:fixed;inset:0;background:rgba(18,19,45,.65);backdrop-filter:blur(6px);z-index:90;display:grid;place-items:center;padding:18px;opacity:0;pointer-events:none;transition:opacity .3s ease}
.notif-modal-overlay.open{opacity:1;pointer-events:auto}
.notif-modal-card{width:100%;max-width:440px;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 24px 50px rgba(0,0,0,.3);transform:scale(.94) translateY(12px);transition:transform .3s cubic-bezier(.16,1,.3,1);position:relative;max-height:calc(92vh);display:flex;flex-direction:column}
.notif-modal-overlay.open .notif-modal-card{transform:scale(1) translateY(0)}
.notif-modal-hero{width:100%;aspect-ratio:16/9;background-color:#252776;background-size:cover;background-position:center;position:relative;flex-shrink:0}
.notif-modal-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.65) 100%)}
.notif-modal-close{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;border:none;display:grid;place-items:center;cursor:pointer;z-index:2;transition:background .2s}
.notif-modal-close:hover{background:rgba(0,0,0,.85)}
.notif-modal-close svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.notif-modal-body{padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.notif-modal-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.notif-modal-badge svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
.notif-modal-title{font-family:var(--serif);font-size:24px;font-weight:600;line-height:1.15;color:var(--ink)}
.notif-modal-meta{font-size:12px;color:var(--ink);padding:8px 12px;background:var(--paper);border-radius:10px;border-left:3px solid var(--cinnamon);font-weight:500}
.notif-modal-desc{font-size:14px;color:#3f3f5c;line-height:1.55}
.notif-modal-perks{list-style:none;padding:0;margin:4px 0;display:flex;flex-direction:column;gap:6px}
.notif-modal-perks li{font-size:13px;display:flex;align-items:flex-start;gap:8px;color:var(--ink)}
.notif-modal-perks li svg{width:16px;height:16px;stroke:#17663a;fill:none;stroke-width:2.2;flex-shrink:0;margin-top:2px}
.notif-modal-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.notif-modal-btn{flex:1;min-width:120px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:12px;font-size:13px;font-weight:500;text-decoration:none;cursor:pointer;border:none;transition:background .2s,transform .15s}
.notif-modal-btn.primary{background:var(--cinnamon);color:#fff}
.notif-modal-btn.primary:hover{background:var(--cinnamon-d);transform:translateY(-1px)}
.notif-modal-btn.secondary{background:var(--paper);color:var(--cinnamon);border:1px solid var(--line)}
.notif-modal-btn.secondary:hover{background:#eceaf7}

/* ---------- hero ---------- */
.hero{position:relative;min-height:88vh;min-height:88svh;display:flex;align-items:flex-end;color:#fff;background-color:var(--sea);background-image:var(--img);background-position:center;background-size:cover;background-repeat:no-repeat;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(var(--shade),.45) 0%,rgba(var(--shade),.05) 35%,rgba(var(--shade),.7) 100%)}
.hero .in{position:relative;width:100%;max-width:1080px;margin:0 auto;padding:0 22px 56px}
.hero .eyebrow{color:var(--tint)}
.hero h1{font-family:var(--serif);font-weight:500;font-size:clamp(40px,9vw,76px);line-height:1.02;margin-top:10px}
.hero p{max-width:520px;margin-top:12px;font-size:15px;font-weight:300;color:#ecebf7}
.hero .cta{display:inline-flex;align-items:center;gap:10px;margin-top:22px;padding:13px 22px;border:1px solid rgba(255,255,255,.7);font-size:12px;letter-spacing:.2em;text-transform:uppercase}
.hero .cta:active{background:rgba(255,255,255,.15)}
.scrollhint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:1px;height:28px;background:rgba(255,255,255,.6)}

/* ---------- section blocks ---------- */
.block{padding:56px 0}
.block .head{text-align:center;max-width:620px;margin:0 auto 28px;padding:0 20px}
.block .head .title{font-size:clamp(30px,6vw,44px);margin-top:8px}
.block .head p{color:var(--muted);margin-top:10px;font-weight:300}
.block.alt{background:var(--paper)}

/* ---------- dial ---------- */
.dial{max-width:430px;margin:0 auto;padding:0 12px}
.dial svg{width:100%;height:auto;display:block;overflow:visible}
.seg path{fill:var(--paper);stroke:var(--line);stroke-width:1.2;transition:fill .2s}
.seg:hover path,.seg:focus path{fill:#f1f0fa}
.seg:active path{fill:#e4e3f5}
.seg text{fill:var(--ink);font-family:var(--sans);font-size:10.5px;font-weight:500;text-anchor:middle;letter-spacing:.03em}
.seg .ic{stroke:var(--cinnamon);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.dial .ring{fill:none;stroke:var(--gold);stroke-width:1}
.ctr .c1{fill:var(--sea);transition:filter .2s}
.ctr:hover .c1{filter:brightness(1.12)}
.ctr .c2{fill:none;stroke:rgba(243,217,181,.55);stroke-width:1}
.ctr text.t1{font-family:var(--serif);font-size:24px;font-weight:600;fill:#fff;text-anchor:middle}
.ctr text.t2{font-family:var(--sans);font-size:9.5px;fill:var(--tint);text-anchor:middle;letter-spacing:.18em}
.ctr .ic{stroke:var(--tint);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* ---------- photo tiles (home) ---------- */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:0 14px;max-width:1080px;margin:0 auto}
@media (min-width:760px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}}
.tile{position:relative;display:block;aspect-ratio:3/4;overflow:hidden;background:var(--sea);color:#fff}
.tile.wide{grid-column:span 2;aspect-ratio:16/10}
.tile .pic{position:absolute;inset:0;background-image:var(--img);background-position:center;background-size:cover;background-repeat:no-repeat;transition:transform .6s}
.tile:hover .pic{transform:scale(1.05)}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(var(--shade),0) 40%,rgba(var(--shade),.78))}
.tile .cap{position:absolute;left:14px;right:14px;bottom:14px;z-index:1}
.tile .cap b{display:block;font-family:var(--serif);font-weight:500;font-size:22px;line-height:1.1}
.tile .cap span{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--tint);margin-top:6px}

/* ---------- feature split ---------- */
.split{display:grid;gap:0;max-width:1080px;margin:0 auto}
@media (min-width:760px){.split{grid-template-columns:1fr 1fr;align-items:center}.split.rev .ph{order:2}}
.split .ph{display:block;aspect-ratio:4/3;background-color:var(--sea);background-image:var(--img);background-position:center;background-size:cover;background-repeat:no-repeat}
.split .tx{padding:28px 22px 8px}
@media (min-width:760px){.split .tx{padding:40px 48px}}
.split .title{font-size:34px;margin-top:8px}
.split p{color:var(--muted);margin-top:10px;font-weight:300}
.split-spa-logo{display:inline-flex;align-items:center;background:#fff;padding:6px 14px;border-radius:10px;border:1px solid var(--line);box-shadow:0 3px 12px rgba(37,39,118,.08);margin-bottom:12px}
.split-spa-logo img{height:38px;width:auto;display:block;object-fit:contain}
.link{display:inline-flex;align-items:center;gap:8px;margin-top:18px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--cinnamon);border-bottom:1px solid currentColor;padding-bottom:4px}
.link svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6}

/* ---------- contact strip ---------- */
.contact{background:var(--night);color:#ecebf7;text-align:center;padding:48px 20px 40px}
.contact .title{color:#fff;font-size:32px;margin-top:8px}
.contact .eyebrow{color:var(--gold)}
.cbtns{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:22px}
.cbtns a{display:inline-flex;align-items:center;gap:8px;padding:12px 18px;border:1px solid rgba(236,235,247,.35);font-size:13px;letter-spacing:.06em}
.cbtns svg{width:16px;height:16px;stroke:var(--gold);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.contact small{display:block;margin-top:26px;font-size:11px;color:#9b9ab8;letter-spacing:.08em}

/* ---------- inner pages ---------- */
.phero{position:relative;min-height:46vh;display:flex;align-items:flex-end;color:#fff;background-color:var(--sea);background-image:var(--img);background-position:center;background-size:cover;background-repeat:no-repeat}
.phero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(var(--shade),.5),rgba(var(--shade),.15) 40%,rgba(var(--shade),.78))}
.phero .in{position:relative;width:100%;max-width:1080px;margin:0 auto;padding:90px 22px 30px}
.phero .eyebrow{color:var(--tint)}
.phero-logo{display:inline-flex;align-items:center;background:#fff;padding:8px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.28);margin-bottom:12px}
.phero-logo img{height:46px;width:auto;display:block;object-fit:contain}
.phero h2{font-family:var(--serif);font-weight:500;font-size:clamp(34px,7vw,56px);line-height:1.05;margin-top:8px}
.phero p{max-width:560px;margin-top:8px;font-weight:300;color:#ecebf7}
.crumb{display:inline-flex;align-items:center;gap:6px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#fff;opacity:.9}
.crumb svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8}
.group{max-width:1080px;margin:0 auto;padding:30px 16px 0}
.group h3{font-family:var(--serif);font-weight:500;font-size:26px;margin:0 4px 14px;display:flex;align-items:center;gap:12px}
.group h3::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:760px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}}
.card{display:block;background:var(--paper);overflow:hidden;box-shadow:0 1px 0 var(--line);transition:transform .2s,box-shadow .2s}
.card:hover{box-shadow:0 10px 28px rgba(37,39,118,.14)}
.card:active{transform:scale(.98)}
.card .ph{position:relative;display:block;aspect-ratio:3/4;background:linear-gradient(135deg,#e9e8f6,#f6f6fb);overflow:hidden}
.card .ph img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;object-position:top;opacity:0;transition:opacity .4s}
.card .ph img.ok{opacity:1}
.card .ph .fb{position:absolute;inset:0;display:grid;place-items:center}
.card .ph .fb svg{width:30px;height:30px;stroke:var(--cinnamon);fill:none;stroke-width:1.3;opacity:.5}
.card .cap{display:block;padding:12px 12px 14px;border-top:2px solid var(--cinnamon)}
.card .cap b{display:block;font-weight:500;font-size:14px;line-height:1.3}
.card .cap span{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.list{background:var(--paper);box-shadow:0 1px 0 var(--line)}
.item{display:flex;align-items:center;gap:14px;padding:16px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .badge{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;flex:none}
.item .badge svg{width:18px;height:18px;stroke:var(--cinnamon);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.item .tx{flex:1;min-width:0}.item .tx b{display:block;font-weight:500}.item .tx span{display:block;font-size:13px;color:var(--muted)}
.item .chev{width:16px;height:16px;stroke:#b9b8cf;fill:none;stroke-width:1.8;flex:none}
.feature{display:block;position:relative;aspect-ratio:16/9;background-color:var(--sea);background-image:var(--img);background-position:center;background-size:cover;background-repeat:no-repeat;color:#fff;overflow:hidden}
@media (min-width:760px){.feature{aspect-ratio:21/8}}
.feature::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(var(--shade),.75),rgba(var(--shade),.1))}
.feature div{position:absolute;left:20px;right:20px;bottom:18px}
.feature small{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--tint)}
.feature b{display:block;font-family:var(--serif);font-weight:500;font-size:26px;line-height:1.15;margin-top:4px;max-width:420px}
.empty{background:var(--paper);padding:26px;text-align:center;color:var(--muted)}
.mapimg{width:100%;background:#e9e8f6;box-shadow:0 1px 0 var(--line)}
.note{font-size:13px;color:var(--muted);margin:12px 4px 0}

/* ---------- document content ---------- */
.phero.flat{min-height:230px}
.djump{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:20;display:flex;gap:8px;overflow-x:auto;padding:10px 16px;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);scrollbar-width:none}
.djump::-webkit-scrollbar{display:none}
.djump button{flex:none;font:inherit;font-size:12px;color:var(--cinnamon);background:var(--paper);border:1px solid var(--line);padding:7px 12px;cursor:pointer;white-space:nowrap}
.doc{max-width:760px;margin:0 auto;padding:26px 20px 48px}
.dh{font-family:var(--serif);font-weight:500;font-size:29px;line-height:1.15;margin:34px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line);scroll-margin-top:125px}
.doc > .dh:first-child{margin-top:0}
.dpart{font-family:var(--serif);font-weight:500;font-size:36px;color:var(--cinnamon);margin:52px 0 0;text-align:center}
.dsub{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--cinnamon);font-weight:500;margin:24px 0 8px}
.dkick{font-family:var(--serif);font-style:italic;font-size:21px;line-height:1.3;color:var(--cinnamon);margin:0 0 12px}
.dp{margin:0 0 12px;font-weight:300;font-size:16px}
.dul{margin:0 0 14px;padding:0;list-style:none}
.dul li{position:relative;padding:6px 0 6px 18px;font-weight:300;border-bottom:1px solid #f0f0f7}
.dul li::before{content:"";position:absolute;left:2px;top:15px;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.dnote{font-size:14px;color:var(--muted);margin:12px 0}
.dcall{background:var(--paper);border-left:3px solid var(--cinnamon);padding:12px 14px;margin:0 0 18px;font-weight:500;font-size:15px}
.dcall.soft{font-weight:400;font-size:13.5px;color:var(--muted)}
.dq{font-family:var(--serif);font-style:italic;font-size:24px;line-height:1.25;text-align:center;color:var(--cinnamon);margin:26px 0}
.dor{display:flex;align-items:center;gap:12px;margin:2px 0;color:var(--muted);font-family:var(--serif);font-style:italic}
.dor::before,.dor::after{content:"";flex:1;height:1px;background:var(--line)}
.dprice{display:flex;flex-direction:column;align-items:flex-start;background:var(--cinnamon);color:#fff;padding:16px 18px;margin:0 0 18px}
.dprice b{font-family:var(--serif);font-weight:600;font-size:32px;line-height:1.1}
.dprice span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--tint);margin-top:3px}
.dprice small{font-size:13px;margin-top:8px;color:#fff}
.ditem{padding:12px 0;border-bottom:1px solid #f0f0f7}
.dn{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.dn .nm{font-weight:500;font-size:16px;line-height:1.4}
.dn .pr{flex:0 0 auto;max-width:46%;text-align:right;font-weight:500;font-size:14px;color:var(--cinnamon)}
.dd{font-weight:300;font-size:15px;color:#3f3f5c;margin-top:3px}
.dw{font-size:13px;font-style:italic;color:var(--muted);margin-top:5px}
.tag{display:inline-block;font-size:10.5px;font-weight:500;letter-spacing:.03em;line-height:1;color:#7a4a12;background:#fbf1e2;border:1px solid #f0dcbc;border-radius:20px;padding:3px 7px;margin:1px 1px;vertical-align:1px;white-space:nowrap}
.tag.good{color:#17663a;background:#e8f5ec;border-color:#c9e6d3}
.dcards{display:grid;gap:10px;margin:0 0 16px}
@media (min-width:620px){.dcards{grid-template-columns:1fr 1fr}}
.dcard{background:var(--paper);padding:14px 16px;box-shadow:0 1px 0 var(--line)}
.dcard b{display:block;font-weight:500;margin-bottom:4px}
.dcard p{font-size:14px;font-weight:300;margin-top:3px;overflow-wrap:anywhere}
.dqa > div{padding:10px 0;border-bottom:1px solid #f0f0f7}
.dqa b{font-weight:500}
.dqa p{font-weight:300;font-size:15px;margin-top:3px}
.dtable{width:100%;border-collapse:collapse;margin:0 0 16px;font-size:15px}
.dtable th{text-align:left;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:6px 8px 6px 0;border-bottom:1px solid var(--line)}
.dtable td{padding:9px 8px 9px 0;border-bottom:1px solid #f0f0f7;font-weight:300}
.dtable td:first-child{font-weight:500}
.ptable{margin:0 0 20px}
.ptable h4{display:flex;justify-content:space-between;gap:12px;font-weight:500;font-size:16px;padding:9px 12px;background:var(--paper);border-left:3px solid var(--cinnamon)}
.ptable h4 span{flex:none;color:var(--cinnamon)}
.ptable .tn{display:block;font-size:12px;color:var(--muted);padding:5px 12px 0}
.ptable table{width:100%;border-collapse:collapse}
.ptable td{padding:8px 12px;border-bottom:1px solid #f0f0f7;vertical-align:baseline;font-size:15px}
.ptable td b{font-weight:400}
.ptable td small{display:block;font-size:12px;color:var(--muted)}
.ptable .num{text-align:right;white-space:nowrap;font-weight:500;color:var(--cinnamon);font-size:14px}
.sched{display:grid;gap:12px}
@media (min-width:620px){.sched{grid-template-columns:1fr 1fr}}
.day{background:var(--paper);padding:14px 16px;box-shadow:0 1px 0 var(--line)}
.day.today{box-shadow:inset 0 0 0 2px var(--cinnamon)}
.day h4{display:flex;align-items:center;justify-content:space-between;font-family:var(--serif);font-weight:500;font-size:24px;margin-bottom:6px}
.day h4 em{font-family:var(--sans);font-style:normal;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:var(--cinnamon);padding:3px 8px}
.slot{padding:8px 0;border-top:1px solid var(--line)}
.slot .when{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--cinnamon);margin-bottom:3px}
.slot b{display:block;font-weight:500}
.slot small{display:block;font-size:13px;color:var(--muted);margin-bottom:3px}
.dcontact{display:flex;flex-direction:column;gap:6px;margin:0 0 12px}
.dcontact a{color:var(--cinnamon);border-bottom:1px solid var(--line);padding:8px 0;overflow-wrap:anywhere}
.dlink{background:var(--paper);margin:0 0 16px}
.dcodes{background:var(--paper);padding:12px 14px;margin:0 0 16px}
.dcodes summary{cursor:pointer;font-weight:500;color:var(--cinnamon)}
.dcodes .cq{width:100%;font:inherit;font-size:16px;padding:10px 12px;margin:12px 0;border:1px solid var(--line);background:#fff}
.dcodes ul{list-style:none}
.dcodes li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.dcodes li[hidden]{display:none}
.dcodes li b{font-weight:500;white-space:nowrap}
.dfoot{font-size:13px;color:var(--muted);text-align:center;margin:28px 0 0;padding-top:16px;border-top:1px solid var(--line)}
.dorig{display:flex;width:max-content;max-width:100%;margin:20px auto 0}

/* ---------- document viewer ---------- */
.viewer{position:fixed;inset:0;background:#1b1b1b;display:flex;flex-direction:column;z-index:60}
.vbar{display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));background:var(--cream);border-bottom:1px solid var(--line)}
.vbar .ttl{flex:1;font-family:var(--serif);font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vbar .back{display:grid;place-items:center;width:36px;height:36px}
.vbar .back svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.8}
.vbar .open{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--cinnamon);border:1px solid currentColor;padding:8px 12px}
.viewer iframe{flex:1;border:0;width:100%;background:#2b2b2b}

/* ---------- bottom tabs ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 2px calc(6px + var(--safeB))}
.tabs a, .tabs .tab-item{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:4px 3px;min-width:0;flex:1 1 0;text-align:center;position:relative}
.tabs a.on{color:var(--cinnamon)}
.tabs svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tab-disabled{opacity:.45;cursor:not-allowed;user-select:none}
.tab-soon{position:absolute;top:-3px;right:50%;transform:translateX(16px);font-size:7.5px;font-weight:600;padding:1px 3px;border-radius:3px;background:var(--line);color:var(--cinnamon);line-height:1;letter-spacing:0}

/* ---------- gallery & lightbox ---------- */
.gallery-bar{display:flex;gap:8px;overflow-x:auto;padding:20px 16px 8px;max-width:1080px;margin:0 auto;scrollbar-width:none}
.gallery-bar::-webkit-scrollbar{display:none}
.gallery-chip{flex:none;font:inherit;font-size:12px;color:var(--muted);background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:7px 15px;cursor:pointer;transition:all .2s;font-weight:500}
.gallery-chip.on{background:var(--cinnamon);color:#fff;border-color:var(--cinnamon)}
.gallery-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:12px 16px 40px;max-width:1080px;margin:0 auto}
@media (min-width:760px){.gallery-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}}
@media (min-width:1020px){.gallery-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}

.gallery-card{position:relative;aspect-ratio:4/3;background:var(--sea);border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.06);cursor:pointer;transition:transform .3s ease,box-shadow .3s ease}
.gallery-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(37,39,118,.16)}
.gallery-card img{width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.7,.2,1);image-rendering:-webkit-optimize-contrast}
.gallery-card:hover img{transform:scale(1.06)}
.gallery-card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.75) 100%)}
.gallery-card .cap{position:absolute;left:12px;right:12px;bottom:10px;z-index:1;color:#fff}
.gallery-card .cap small{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--tint);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gallery-card .cap b{display:block;font-family:var(--serif);font-size:16px;font-weight:600;line-height:1.2;margin-top:2px;text-shadow:0 1px 3px rgba(0,0,0,.8)}

.lightbox{position:fixed;inset:0;z-index:100;background:rgba(14,15,35,.94);backdrop-filter:blur(10px);display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .3s ease}
.lightbox.open{opacity:1;pointer-events:auto}
.lightbox-top{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 10px;color:#fff}
.lightbox-counter{font-size:12px;letter-spacing:.1em;opacity:.8}
.lightbox-close{background:none;border:none;color:#fff;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;cursor:pointer;transition:background .2s}
.lightbox-close:hover{background:rgba(255,255,255,.15)}
.lightbox-close svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}
.lightbox-main{flex:1;display:flex;align-items:center;justify-content:center;position:relative;padding:10px 60px;min-height:0}
.lightbox-main img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.6);transition:opacity .2s ease}
.lightbox-btn{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;display:grid;place-items:center;cursor:pointer;transition:background .2s,transform .15s}
.lightbox-btn:hover{background:rgba(255,255,255,.25);transform:translateY(-50%) scale(1.06)}
.lightbox-btn.prev{left:12px}
.lightbox-btn.next{right:12px}
.lightbox-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2}
.lightbox-bottom{padding:14px 20px calc(14px + var(--safeB, 0px));text-align:center;color:#fff;max-width:700px;margin:0 auto}
.lightbox-cat{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--tint);font-weight:600;margin-bottom:6px}
.lightbox-title{font-family:var(--serif);font-size:22px;font-weight:500}
.lightbox-desc{font-size:13px;color:#d5d4ea;margin-top:4px;font-weight:300}

/* toast */
.toast{position:fixed;bottom:calc(75px + var(--safeB, 0px));left:50%;transform:translateX(-50%) translateY(20px);background:rgba(23,24,63,.95);color:#fff;padding:9px 16px;border-radius:20px;font-size:12px;letter-spacing:.03em;z-index:80;box-shadow:0 4px 18px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* today activities spotlight */
.today-act-card{background:var(--paper);border:1px solid var(--line);border-top:3px solid var(--cinnamon);padding:22px 20px;box-shadow:0 4px 18px rgba(37,39,118,.06);margin-bottom:8px}
.today-act-badge{display:inline-block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:var(--cinnamon);padding:4px 10px;border-radius:20px;font-weight:600;margin-bottom:10px}
.today-act-card h3{font-family:var(--serif);font-size:26px;font-weight:500;margin:0 0 6px;color:var(--ink)}
.today-act-sub{font-size:14px;color:var(--muted);font-weight:300;margin:0 0 18px}
.today-act-grid{display:grid;gap:16px}
@media (min-width:680px){.today-act-grid{grid-template-columns:1fr 1fr;gap:20px}}
.today-act-col{background:#fff;border:1px solid var(--line);padding:16px}
.today-act-col h4{display:flex;align-items:center;gap:8px;font-family:var(--sans);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--cinnamon);font-weight:600;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.today-act-col h4 svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
.today-act-slot{padding:8px 0;border-bottom:1px solid #f2f2fa}
.today-act-slot:last-child{border-bottom:0;padding-bottom:0}
.today-act-time{display:block;font-size:11px;font-weight:600;color:var(--gold);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.today-act-ev{margin-bottom:6px}
.today-act-ev:last-child{margin-bottom:0}
.today-act-ev b{display:block;font-size:14.5px;font-weight:500;color:var(--ink);line-height:1.3}
.today-act-ev small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.empty-act{font-size:13px;color:var(--muted);font-style:italic;margin:6px 0}

/* ---------- island news ---------- */
.news-feed{max-width:860px;margin:0 auto;padding:20px 16px 40px;display:flex;flex-direction:column;gap:32px}
.news-card{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 4px 20px rgba(37,39,118,.06);transition:transform .3s ease,box-shadow .3s ease}
.news-card:hover{box-shadow:0 8px 28px rgba(37,39,118,.12)}
.news-card-body{padding:22px 20px 24px}
.news-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.news-badge{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--cinnamon);background:var(--tint);padding:4px 12px;border-radius:20px;font-weight:600}
.news-badge svg{width:12px;height:12px;fill:currentColor}
.news-date{font-size:12px;color:var(--muted);font-weight:400}
.news-category-tag{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:6px;line-height:1.4}
.news-title{font-family:var(--serif);font-size:22px;line-height:1.3;color:var(--ink);margin:0 0 10px;font-weight:600}
.news-sub{font-size:14px;color:var(--muted);line-height:1.5;margin:0 0 18px;font-weight:400}
.news-media-grid{display:grid;grid-template-columns:1fr;gap:14px;margin:18px 0 20px}
.news-media-grid.two-col{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.news-photo-wrap{position:relative;border-radius:10px;overflow:hidden;background:#141537;cursor:pointer;aspect-ratio:1414/2000;max-height:520px;box-shadow:0 3px 12px rgba(0,0,0,.08);margin:0 auto;width:100%}
.news-photo-wrap img{width:100%;height:100%;object-fit:cover;transition:transform .5s cubic-bezier(.2,.7,.2,1);display:block}
.news-photo-wrap:hover img{transform:scale(1.03)}
.news-photo-wrap .zoom-pill{position:absolute;bottom:12px;right:12px;background:rgba(23,24,63,.85);backdrop-filter:blur(6px);color:#fff;font-size:11px;padding:6px 12px;border-radius:16px;display:flex;align-items:center;gap:6px;pointer-events:none;font-weight:500;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.news-photo-wrap .zoom-pill svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.2}
.news-desc{font-size:14.5px;color:#333;line-height:1.7;margin:0}

/* =================== ANIMATIONS =================== */
@keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes kenburns{from{transform:scale(1.14)}to{transform:scale(1)}}
@keyframes segIn{from{opacity:0;transform:scale(.82) rotate(-8deg)}to{opacity:1;transform:none}}
@keyframes ctrIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes pulse{0%{transform:scale(1);opacity:.55}70%{transform:scale(1.12);opacity:0}100%{opacity:0}}
@keyframes hint{0%{transform:translateX(-50%) scaleY(0);transform-origin:top}50%{transform:translateX(-50%) scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:translateX(-50%) scaleY(0);transform-origin:bottom}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}

/* page transition */
#app.enter{animation:fadeIn .55s ease both}

/* hero: slow zoom + staggered text */
.hero,.phero{isolation:isolate;overflow:hidden}
html,body{overflow-x:clip}
.hero .bgz,.phero .bgz{position:absolute;inset:0;z-index:-1;background-color:var(--sea);background-image:var(--img);background-position:center;background-size:cover;background-repeat:no-repeat;animation:kenburns 16s cubic-bezier(.2,.6,.3,1) both}
.hero .in > *{opacity:0;animation:fadeUp .9s cubic-bezier(.2,.7,.2,1) both}
.hero .in > :nth-child(1){animation-delay:.25s}
.hero .in > :nth-child(2){animation-delay:.45s}
.hero .in > :nth-child(3){animation-delay:.65s}
.hero .in > :nth-child(4){animation-delay:.85s}
.phero .in > *{opacity:0;animation:fadeUp .8s cubic-bezier(.2,.7,.2,1) both}
.phero .in > :nth-child(2){animation-delay:.12s}
.phero .in > :nth-child(3){animation-delay:.24s}
.scrollhint{animation:hint 2.2s ease-in-out infinite}
.hero .cta{transition:background .3s,letter-spacing .3s}
.hero .cta:hover{background:rgba(255,255,255,.14);letter-spacing:.26em}

/* scroll reveal */
.rv{opacity:0;transform:translateY(26px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
.rv.seen{opacity:1;transform:none}

/* dial assembles when it scrolls into view */
.dial .seg,.dial .ctr{transform-box:view-box;transform-origin:200px 200px;opacity:0}
.dial.seen .seg{animation:segIn .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 90ms + .1s)}
.dial.seen .ctr{animation:ctrIn .8s cubic-bezier(.2,.9,.3,1.2) .05s both}
.dial .seg path{transition:fill .25s,transform .25s;transform-box:view-box;transform-origin:200px 200px}
.dial .seg:hover path{transform:scale(1.025)}
.dial .ring{transform-box:view-box;transform-origin:200px 200px;stroke-dasharray:3 7;animation:spin 90s linear infinite}
.dial .pulse{fill:none;stroke:var(--gold);stroke-width:1.2;transform-box:view-box;transform-origin:200px 200px;animation:pulse 3.2s ease-out 1.4s infinite}

/* tiles, cards, links */
.tile .pic{transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.tile:hover .pic{transform:scale(1.08)}
.tile .cap span{transition:letter-spacing .4s,color .3s}
.tile:hover .cap span{letter-spacing:.3em;color:#fff}
.split .ph{transition:filter .6s}
.split .ph:hover{filter:brightness(1.06) saturate(1.08)}
.link svg{transition:transform .3s}
.link:hover svg{transform:translateX(5px)}
.card{transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s}
.card:hover{transform:translateY(-4px)}
.card .ph img{transition:opacity .5s,transform .8s cubic-bezier(.2,.7,.2,1)}
.card:hover .ph img{transform:scale(1.05)}
.feature{background-size:cover;transition:background-size .8s}
.cbtns a{transition:background .3s,border-color .3s}
.cbtns a:hover{background:rgba(236,235,247,.08);border-color:var(--gold)}
.tabs a{transition:color .25s,transform .25s}
.tabs a:active{transform:scale(.92)}
.tabs a.on svg{animation:fadeUp .4s ease both}
.viewer{animation:slideUp .45s cubic-bezier(.2,.8,.2,1) both}

/* respect "reduce motion" phone settings */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
  .rv,.hero .in > *,.phero .in > *,.dial .seg,.dial .ctr{opacity:1 !important;transform:none !important}
}
</style>
</head>

        <span class="notif-dot" id="notifDot"></span>

</header>
<main id="app"></main>

/* ---------- Dial ---------- */
function polar(r, deg){ const a=(deg-90)*Math.PI/180; return [200+r*Math.cos(a), 200+r*Math.sin(a)]; }
function segPath(a0,a1,R,r){
  const [x0,y0]=polar(R,a0),[x1,y1]=polar(R,a1),[x2,y2]=polar(r,a1),[x3,y3]=polar(r,a0);
  const f=n=>n.toFixed(2);
  return `M${f(x0)} ${f(y0)}A${R} ${R} 0 0 1 ${f(x1)} ${f(y1)}L${f(x2)} ${f(y2)}A${r} ${r} 0 0 0 ${f(x3)} ${f(y3)}Z`;
}
function dialSvg(){
  const n = DIAL.length, step = 360/n, R=194, r=120;
  let segs = '';
  DIAL.forEach((key,i) => {
    const a0 = i*step - step/2, a1 = a0+step, mid = i*step;
    const [cx,cy] = polar((R+r)/2, mid), lab = DIAL_LABELS[key];
    const ty = cy + 10 - (lab.length-1)*6;
    segs += `<a class="seg" style="--i:${i}" href="#/${key}" aria-label="${esc(SECTIONS[key].title)}">
      <path d="${segPath(a0+.8,a1-.8,R,r)}"/>
      <g transform="translate(${(cx-11).toFixed(1)},${(cy-31).toFixed(1)}) scale(.92)"><g class="ic">${ICONS[SECTIONS[key].icon]}</g></g>
      ${lab.map((t,j)=>`<text x="${cx.toFixed(1)}" y="${(ty+j*12).toFixed(1)}">${esc(t)}</text>`).join('')}</a>`;
  });
  return `<svg viewBox="-6 -6 412 412" role="navigation" aria-label="Guest directory">
    <circle class="ring" cx="200" cy="200" r="201"/>${segs}
    <circle class="pulse" cx="200" cy="200" r="112"/>
    <a class="ctr" href="#/packages" aria-label="${esc(SECTIONS.packages.title)}">
      <circle class="c1" cx="200" cy="200" r="112"/><circle class="c2" cx="200" cy="200" r="100"/>
      <image href="img/logo-flower.png" x="178" y="136" width="44" height="44"/>
      <text class="t1" x="200" y="202">All-Inclusive</text>
      <text class="t2" x="200" y="224">PACKAGES &amp; MENUS</text></a></svg>`;
}

      <div class="tx">${logo}<div class="eyebrow">${esc(eyebrow)}</div><h3 class="title">${title}</h3>
        <p>${esc(SECTIONS[k].intro)}</p><a class="link" href="#/${k}">Discover ${svg('arrow')}</a></div></section>`;
  };
  app.innerHTML = `
    <section class="hero"><span class="bgz" style="${bgVar('home')}"></span>
      <div class="in"><div class="eyebrow">${esc(RESORT.tagline)} · Guest Directory</div>
        <h1>Welcome to<br>${esc(RESORT.name)}</h1><p>${esc(RESORT.welcome)}</p>
        <a class="cta" href="#explore" onclick="event.preventDefault();document.getElementById('explore').scrollIntoView()">Explore ${svg('down')}</a></div>
      <span class="scrollhint"></span>
    </section>
    <section class="block" id="explore">
      <div class="head rv"><div class="eyebrow">Your island guide</div>
        <h2 class="title"><span class="tilde">~</span>Shall we show you around?</h2>
        <p>Tap a section of the dial to explore menus, experiences, activities and more.</p></div>
      <div class="dial">${dialSvg()}</div>
    </section>
    <section class="block alt">
      <div class="head rv"><div class="eyebrow">Discover</div><h2 class="title"><span class="tilde">~</span>Things to do</h2></div>
      <div class="tiles">${tiles}</div>
    </section>
    <section class="block">
      ${split('spa','Wellness','Mandara <em>Spa</em>')}
      <div style="height:28px"></div>
      ${split('menus','Dining','Restaurants &amp; <em>Bars</em>', true)}
      <div style="height:28px"></div>
      ${split('wedding','Celebrations','Island <em>Weddings</em>')}
    </section>
    ${contactBlock()}`;
}
function contactRows(){
  const r = [];
  if (RESORT.phone) r.push(['phone', `tel:${RESORT.phone.replace(/\s/g,'')}`, 'Call Reception', RESORT.phone]);
  if (RESORT.whatsapp) r.push(['chat', `https://wa.me/${RESORT.whatsapp}`, 'WhatsApp', 'Message the team']);
  if (RESORT.email) r.push(['mail', `mailto:${RESORT.email}`, 'Email', RESORT.email]);
  if (RESORT.website) r.push(['globe', RESORT.website, 'Website', 'cinnamonhotels.com']);
  r.push(['image', '#/gallery', 'Gallery', 'View resort photos & moments']);
  r.push(['news', '#/news', 'Island News', 'Stories, initiatives & updates']);
  r.push(['chat', 'javascript:openIslandConcierge()', 'Island Concierge', 'Instant answers 24/7']);
  return r;
}
function contactBlock(){
  return `<section class="contact"><div class="eyebrow rv">We're here for you</div><h2 class="title">Day and night</h2>
    <div class="cbtns">${contactRows().map(([ic,h,l]) => {
      const isExt = h.startsWith('http');
      const isJs = h.startsWith('javascript:');
      const jsCode = isJs ? h.slice(11) : '';
      return `<a href="${isJs ? '#' : h}"${isExt ? ' target="_blank" rel="noopener"' : ''}${isJs ? ` onclick="event.preventDefault();${jsCode};"` : ''}>${svg(ic)}${esc(l)}</a>`;
    }).join('')}</div>
    <small>${esc(RESORT.name)} · ${esc(RESORT.tagline)}</small></section>`;
}

const TAGS = { alcohol:'Alcohol', gluten:'Gluten', mustard:'Mustard', dairy:'Dairy', pork:'Pork', vegetarian:'Vegetarian',
  nuts:'Nuts', egg:'Egg', celery:'Celery', fish:'Fish', molluscs:'Molluscs', soya:'Soya', crustaceans:'Crustaceans',
  peanut:'Peanut', sesame:'Sesame', coconut:'Coconut', spicy:'Spicy', healthy:'Healthy option' };
const GOOD_TAGS = ['vegetarian','healthy'];
/* Escapes text, then turns {gluten} markers into visible tags */
const rich = s => esc(s).replace(/\s*\{(\w+)\}/g, (m,k) => ` <span class="tag${GOOD_TAGS.includes(k)?' good':''}">${esc(TAGS[k]||k)}</span>`);
const anchor = i => `sec-${i}`;
const ALLERGY_NOTE = "Tags show allergen and dietary information as marked on the resort's menu. A dish without a tag is not guaranteed to be allergen free. If you have any concerns regarding food allergies, please alert your server prior to ordering.";

function scheduleBlock(s){
  const today = new Intl.DateTimeFormat('en-US', {weekday:'long', timeZone:'Indian/Maldives'}).format(new Date());
  const slot = (time, list) => list.length ? `<div class="slot"><span class="when">${esc(time)}</span>${list.map(x => {
      const [name, where] = x.split('|');
      return `<b>${esc(name)}</b>${where?`<small>${esc(where)}</small>`:''}`; }).join('')}</div>` : '';
  return `<div class="sched">${s.days.map(([day,a,b]) => `<div class="day${day===today?' today':''}">
    <h4>${esc(day)}${day===today?'<em>Today</em>':''}</h4>${slot(s.times[0],a)}${slot(s.times[1],b)}</div>`).join('')}</div>`;
}
function priceTable(t){
  return `<div class="ptable"><h4>${esc(t.cap)}${t.total?`<span>USD ${esc(t.total)}</span>`:''}</h4>${t.note?`<small class="tn">${esc(t.note)}</small>`:''}
    <table>${t.rows.map(([n,d,v]) => `<tr><td><b>${esc(n||d)}</b>${n&&d?`<small>${esc(d)}</small>`:''}</td><td class="num">${v?`USD ${esc(v)}`:''}</td></tr>`).join('')}</table></div>`;
}
function renderBlock(b, i){
  /* items and price panels first: an item's "p" is its price, and a panel's "note" is its caption */
  if (b.price) return `<div class="dprice"><b>${esc(b.price)}</b><span>${esc(b.unit||'')}</span>${b.note?`<small>${esc(b.note)}</small>`:''}</div>`;
  if (b.i)     return `<div class="ditem"><div class="dn"><span class="nm">${rich(b.i)}</span>${b.p?`<span class="pr">${esc(b.p).replace(/ \| /g,'<br>')}</span>`:''}</div>
      ${(b.d||[]).map(x => `<p class="dd">${rich(x)}</p>`).join('')}${b.w?`<p class="dw">Wine pairing: ${esc(b.w)}</p>`:''}</div>`;
  if (b.part)  return `<h2 class="dpart">${esc(b.part)}</h2>`;
  if (b.h)     return `<h3 class="dh" id="${anchor(i)}">${esc(b.h)}</h3>`;
  if (b.sub)   return `<h4 class="dsub">${esc(b.sub)}</h4>`;
  if (b.kicker)return `<p class="dkick">${esc(b.kicker)}</p>`;
  if (b.p)     return `<p class="dp">${rich(b.p)}</p>`;
  if (b.ul)    return `<ul class="dul">${b.ul.map(x => `<li>${rich(x)}</li>`).join('')}</ul>`;
  if (b.note)  return `<p class="dnote">${rich(b.note)}</p>`;
  if (b.callout) return `<p class="dcall">${esc(b.callout)}</p>`;
  if (b.quote) return `<blockquote class="dq">${esc(b.quote)}</blockquote>`;
  if (b.or)    return `<div class="dor"><span>or</span></div>`;
  if (b.cards) return `<div class="dcards">${b.cards.map(c => `<div class="dcard"><b>${esc(c.t)}</b>${c.d.map(x => `<p>${esc(x)}</p>`).join('')}</div>`).join('')}</div>`;
  if (b.qa)    return `<div class="dqa">${b.qa.map(([q,a]) => `<div><b>${esc(q)}</b><p>${esc(a)}</p></div>`).join('')}</div>`;
  if (b.schedule) return scheduleBlock(b.schedule);
  if (b.table) return b.table.cap ? priceTable(b.table) : `<table class="dtable"><thead><tr>${b.table.head.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead>
      <tbody>${b.table.rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  if (b.contact) return `<div class="dcontact">${b.contact.map(([h,l]) => `<a href="${esc(h)}">${esc(l)}</a>`).join('')}</div>`;
  if (b.link)  return `<a class="item dlink" href="#/doc/${esc(b.link)}"><span class="tx"><b>${esc(b.t)}</b><span>${esc(b.d||'')}</span></span>${svg('chev','chev')}</a>`;
  if (b.codes) return `<details class="dcodes"><summary>Show ${b.codes.length} country codes</summary>
      <input class="cq" type="search" placeholder="Search for a country" aria-label="Search for a country">
      <ul>${b.codes.map(([n,c]) => `<li data-n="${esc(n.toLowerCase())}"><span>${esc(n)}</span><b>${esc(c)}</b></li>`).join('')}</ul></details>`;
  return '';
}
function renderDoc(id){

    ${jump}

  const chipsHtml = `<nav class="gallery-bar">${filters.map(([k,l]) =>
    `<button type="button" class="gallery-chip ${curGalleryFilter===k?'on':''}" onclick="setGalleryFilter('${k}')">${esc(l)}</button>`
  ).join('')}</nav>`;

  const cardsHtml = `<div class="gallery-grid">${activeGalleryList.map((it, idx) => `
    <div class="gallery-card rv" onclick="openLightbox(${idx})">
      <img src="${it.src}" alt="${esc(it.title)}" loading="lazy">
      <div class="cap">
        <small>${esc(it.category)}</small>

  `).join('')}</div>`;

  app.innerHTML = pageHero({

  }, 'home') + chipsHtml + cardsHtml + `<div style="height:30px"></div>` + contactBlock();
}

function setGalleryFilter(k){
  curGalleryFilter = k;
  renderGallery();
  arm();
}

function openLightbox(idx){
  curLightboxIndex = idx;
  updateLightboxContent();
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox(){
  document.getElementById('lightbox').classList.remove('open');
}

function updateLightboxContent(){
  const it = activeGalleryList[curLightboxIndex];
  if (!it) return;
  document.getElementById('lightboxImg').src = it.src;
  document.getElementById('lightboxCounter').textContent = `${curLightboxIndex + 1} / ${activeGalleryList.length}`;
  const catEl = document.getElementById('lightboxCat');
  if (catEl) catEl.textContent = it.category || '';
  document.getElementById('lightboxTitle').textContent = it.title;
  document.getElementById('lightboxDesc').textContent = it.desc;
}

function nextLightbox(){
  curLightboxIndex = (curLightboxIndex + 1) % activeGalleryList.length;
  updateLightboxContent();
}

function prevLightbox(){
  curLightboxIndex = (curLightboxIndex - 1 + activeGalleryList.length) % activeGalleryList.length;
  updateLightboxContent();
}

document.addEventListener('keydown', e => {
  const lb = document.getElementById('lightbox');
  if (lb && lb.classList.contains('open')) {
    if (e.key === 'ArrowRight') nextLightbox();
    else if (e.key === 'ArrowLeft') prevLightbox();
    else if (e.key === 'Escape') closeLightbox();
  }
});

    desc: "Cinnamon Velifushi Maldives is dedicated to protecting and rejuvenating the delicate marine ecosystem of Vaavu Atoll. Through our active coral frame propagation project, coral fragments are nurtured to maturity, revitalizing the house reef and providing thriving sanctuary habitats for diverse marine life.",
    images: [
      { src: "img/Coral_1.png", title: "Coral Restoration & Propagation Project", desc: "Protecting and rejuvenating the house reef ecosystem through active coral frame propagation and marine conservation in Vaavu Atoll." }
    ]
  }
];

function renderNews(){
  const newsHtml = `<div class="news-feed">${NEWS_ITEMS.map((item, nIdx) => `
    <article class="news-card rv">
      <div class="news-card-body">
        <div class="news-header">
          <span class="news-badge">${svg('star')}${esc(item.badge)}</span>
          <span class="news-date">${esc(item.date)}</span>
        </div>
        <small class="news-category-tag">${esc(item.category)}</small>
        <h3 class="news-title">${esc(item.title)}</h3>
        <p class="news-sub">${esc(item.subtitle)}</p>
        
        <div class="news-media-grid ${item.images.length > 1 ? 'two-col' : ''}">
          ${item.images.map((img, iIdx) => `
            <div class="news-photo-wrap" onclick="openNewsLightbox(${nIdx}, ${iIdx})">
              <img src="${img.src}" alt="${esc(img.title)}" loading="lazy">
              <span class="zoom-pill">${svg('expand')} View Poster</span>
            </div>
          `).join('')}
        </div>
        
        <p class="news-desc">${esc(item.desc)}</p>
      </div>
    </article>
  `).join('')}</div>`;

  app.innerHTML = pageHero({
    title: "Island News",
    intro: "Stories, celebrations, environmental initiatives, and island happenings at Cinnamon Velifushi Maldives."
  }, 'home') + newsHtml + `<div style="height:20px"></div>` + contactBlock();
}

function openNewsLightbox(newsIdx, imgIdx){
  const news = NEWS_ITEMS[newsIdx];
  if (!news || !news.images[imgIdx]) return;
  const img = news.images[imgIdx];
  document.getElementById('lightboxImg').src = img.src;
  document.getElementById('lightboxCounter').textContent = `Story ${newsIdx + 1} of ${NEWS_ITEMS.length}`;
  const catEl = document.getElementById('lightboxCat');
  if (catEl) catEl.textContent = news.category;
  document.getElementById('lightboxTitle').textContent = img.title;
  document.getElementById('lightboxDesc').textContent = img.desc;
  document.getElementById('lightbox').classList.add('open');
}

/* ---------- Tabs, top bar & router ---------- */
const TABS = [
  ["activities", "calendar", "Activities"],
  ["", "home", "Home"],
  ["menus", "menu", "Dine"],
  ["spa", "spa", "Spa"],
  ["contacts", "phone", "Call"]
];
function renderTabs(cur){
  document.getElementById('tabs').innerHTML = TABS.map(([r,ic,l]) =>
    `<a href="#/${r}" class="tab-item ${cur===r?'on':''}">${svg(ic)}<span>${l}</span></a>`
  ).join('');
}
function showToast(msg){
  let t = document.getElementById('toast');
  if (!t){
    t = document.createElement('div');
    t.id = 'toast';
    t.className = 'toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2500);
}
const topnav = document.getElementById('topnav');
function updateNav(){ topnav.classList.toggle('solid', window.scrollY > 120); }
window.addEventListener('scroll', updateNav, {passive:true});

function route(){
  const h = location.hash.replace(/^#\/?/, '');
  if (h === 'explore') return;
  const [a,b] = h.split('/');
  const tabs = document.getElementById('tabs');
  const viewerOnly = a === 'doc' && b && !(window.CONTENT_READY && CONTENT[b]);
  if (viewerOnly){ renderDoc(b); tabs.style.display='none'; topnav.style.display='none'; return; }
  tabs.style.display=''; topnav.style.display='';
  if (a === 'doc' && b){ renderDoc(b); renderTabs(DOCS[b]?.from || ''); window.scrollTo(0,0); updateNav(); arm(); return; }
  if (a === 'gallery'){ renderGallery(); renderTabs(''); window.scrollTo(0,0); updateNav(); arm(); return; }
  if (a === 'news'){ renderNews(); renderTabs(''); window.scrollTo(0,0); updateNav(); arm(); return; }
  if (a && SECTIONS[a]) renderSection(a); else renderHome();
  renderTabs(SECTIONS[a] ? a : '');
  window.scrollTo(0,0); updateNav(); arm();
}
/* Reveal elements as they scroll into view */
const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting){ e.target.classList.add('seen'); io.unobserve(e.target); }
}), {threshold:.15, rootMargin:'0px 0px -6% 0px'}) : null;
function arm(){
  document.querySelectorAll('.grid').forEach(g => [...g.children].forEach((c,i) => c.style.setProperty('--d', (i%4)*0.07+'s')));
  document.querySelectorAll('.rv:not(.seen), .dial:not(.seen)').forEach(el => io ? io.observe(el) : el.classList.add('seen'));
  app.classList.remove('enter'); void app.offsetWidth; app.classList.add('enter');
}
/* Document pages: "on this page" chips and the country code search */
app.addEventListener('click', e => {
  const b = e.target.closest('.djump button');
  if (b) document.getElementById(b.dataset.to)?.scrollIntoView({behavior:'smooth', block:'start'});
});
app.addEventListener('input', e => {
  if (!e.target.classList.contains('cq')) return;
  const q = e.target.value.trim().toLowerCase();
  e.target.parentElement.querySelectorAll('li').forEach(li => { li.hidden = q && !li.dataset.n.includes(q); });
});
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
